  </g>
  <g fill="none" stroke="#fff0bd" stroke-width="1.2">
    <path d="M12 151 L24 171 M10 166 L24 180 M15 181 L27 190"/>
    <path d="M248 151 L236 171 M250 166 L236 180 M245 181 L233 190"/>
  </g>

  <!-- Nameplate is below the avatar aperture. -->
  <path d="M57 225
    L77 232 L183 232 L203 225
    L211 240 L204 252 L211 265
    L193 276 L67 276 L49 265 L56 252 L49 240 Z"
    fill="#4b201a" stroke="url(#card-gold-metal)" stroke-width="4"/>
  <path d="M61 235 L199 235 L204 246 L198 257
    L204 264 L190 269 L70 269 L56 264 L62 257 L56 246 Z"
    fill="url(#card-gold-blue)" stroke="#ffe9a0" stroke-width="2"/>
  <path d="M72 240 L188 240" stroke="#8c9cff" stroke-width="1.2"
    opacity=".8"/>
  <path d="M130 222 L138 233 L130 242 L122 233 Z"
    fill="url(#card-gold-metal)" stroke="#fff3c5" stroke-width="1.5"/>
  <path d="M130 226 L134 233 L130 237 L126 233 Z"
    fill="url(#card-gold-gem)"/>
  <path d="M51 246 L59 240 L64 246 L59 252 Z
           M209 246 L201 240 L196 246 L201 252 Z"
    fill="url(#card-gold-metal)" stroke="#fff2c0" stroke-width="1"/>
  <circle cx="58" cy="261" r="5" fill="url(#card-gold-gem)"
    stroke="#fff3c5" stroke-width="1.5"/>
  <circle cx="202" cy="261" r="5" fill="url(#card-gold-gem)"
    stroke="#fff3c5" stroke-width="1.5"/>

  <!-- Tiny sparkle accents. -->
  <g fill="#fff9df" filter="url(#card-gold-glow)">
    <path d="M39 69 L41 76 L48 78 L41 80 L39 87 L37 80 L30 78 L37 76 Z"/>
    <path d="M221 69 L223 76 L230 78 L223 80 L221 87 L219 80 L212 78 L219 76 Z"/>
    <path d="M45 207 L47 212 L52 214 L47 216 L45 221 L43 216 L38 214 L43 212 Z"/>
    <path d="M215 207 L217 212 L222 214 L217 216 L215 221 L213 216 L208 214 L213 212 Z"/>
  </g>

  <!-- Transparent photo opening: center (130,128), radius 88.
       No decorative elements are drawn inside this circle. -->
  <!-- ring r=88 dihapus sesuai catatan koreksi; garis luar r=92 dipertahankan -->
  <circle cx="130" cy="128" r="92" fill="none"
    stroke="#fff1ba" stroke-width="1.2" opacity=".9"/>

  <text id="nickname" x="130" y="257"
    text-anchor="middle"
    font-family="Baloo 2, sans-serif"
    font-size="22" font-weight="700"
    textLength="156" lengthAdjust="spacingAndGlyphs"
    fill="#fff1b5" stroke="#332064" stroke-width=".7"
    paint-order="stroke">Awan</text>
</svg>
