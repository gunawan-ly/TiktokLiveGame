  <path d="M130 8
    L139 22 Q154 13 164 29
    Q183 23 193 42 Q211 39 220 58
    Q237 61 239 80
    Q253 94 245 110
    Q253 128 241 144
    Q248 163 232 176
    L222 202 L205 222
    L55 222 L38 202 L28 176
    Q12 163 19 144
    Q7 128 15 110
    Q7 94 21 80
    Q23 61 40 58
    Q49 39 67 42
    Q77 23 96 29 Q106 13 121 22 Z M42 128 a88 88 0 1 0 176 0 a88 88 0 1 0 -176 0"
    fill="#4a1d20" opacity=".92" fill-rule="evenodd"/>

  <path d="M130 13
    C117 28 99 20 89 39
    C73 34 57 48 53 64
    C35 71 30 88 30 105
    C20 124 27 145 35 158
    C34 179 46 193 59 207
    L201 207 C214 193 226 179 225 158
    C233 145 240 124 230 105
    C230 88 225 71 207 64
    C203 48 187 34 171 39
    C161 20 143 28 130 13 Z"
    fill="none" stroke="url(#card-gold-metal)" stroke-width="5"/>

  <path d="M130 20
    C115 35 100 29 91 46
    C72 42 63 55 59 72
    C43 79 40 95 39 109
    M130 20
    C145 35 160 29 169 46
    C188 42 197 55 201 72
    C217 79 220 95 221 109"
    fill="none" stroke="#fff0b0" stroke-width="1.6"/>

