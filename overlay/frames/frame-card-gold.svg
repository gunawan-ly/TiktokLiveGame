  <g fill="none" stroke="url(#card-gold-light)" stroke-width="2.5"
     stroke-linecap="round">
    <path d="M82 36 C59 26 42 39 49 53 C55 63 68 53 62 46
             C58 42 53 47 57 50"/>
    <path d="M178 36 C201 26 218 39 211 53 C205 63 192 53 198 46
             C202 42 207 47 203 50"/>
    <path d="M32 91 C13 77 13 99 27 103 C34 105 38 98 32 95"/>
    <path d="M228 91 C247 77 247 99 233 103 C226 105 222 98 228 95"/>
    <path d="M43 171 Q21 156 27 140 Q32 131 39 140
             M217 171 Q239 156 233 140 Q228 131 221 140"/>
    <path d="M46 188 Q25 182 29 165 M214 188 Q235 182 231 165"/>
  </g>

  <!-- Crown -->
  <path d="M103 31 L96 16 L115 25 L130 5 L145 25 L164 16 L157 31
           Q130 43 103 31 Z"
    fill="url(#card-gold-metal)" stroke="#fff0b4" stroke-width="1.5"/>
  <!-- panel merah mahkota dihapus: tertutup hati yang dipindah ke atas -->
  <circle cx="130" cy="11" r="4" fill="url(#card-gold-gem)"
    stroke="#fff5d0" stroke-width="2"/>
  <!-- berlian putih mahkota dihapus: tertutup hati yang dipindah ke atas -->

  <!-- Heart jewel above the opening, never over the photo. -->
  <g transform="translate(130,27) scale(0.45) translate(-130,-71.5)">
    <path d="M130 63
    C119 51 103 46 96 56
    C88 68 105 82 130 97
    C155 82 172 68 164 56
    C157 46 141 51 130 63 Z"
    fill="#8e321d" stroke="url(#card-gold-metal)" stroke-width="5"/>

  </g>

  <!-- Side star gemstones. -->
  <g stroke="url(#card-gold-metal)" stroke-width="3">
    <g transform="translate(-1.5,16.24) scale(0.86)">
      <path d="M28 96 L36 107 L49 111 L39 122 L38 136
               L27 129 L15 136 L16 122 L6 111 L20 107 Z"
        fill="url(#card-gold-gem)"/>
    </g>
    <g transform="translate(38,16.24) scale(0.86)">
      <path d="M232 96 L240 107 L254 111 L244 122 L245 136
               L233 129 L222 136 L221 122 L211 111 L224 107 Z"
        fill="url(#card-gold-gem)"/>
