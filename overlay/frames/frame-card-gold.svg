    </g>
    <g transform="translate(38,16.24) scale(0.86)">
      <path d="M232 108 L235 116 L243 119 L235 122 L232 130 L229 122 L221 119 L229 116 Z"/>
    </g>
  </g>

  <!-- Feather flourishes around the lower outer edge. -->
  <g stroke="url(#card-gold-metal)" stroke-width="1.8"
     stroke-linejoin="round">
    <path d="M24 171 Q3 163 9 145 Q22 154 24 171 Z"
      fill="#fff8e9"/>
    <path d="M24 180 Q2 179 6 160 Q20 164 24 180 Z"
      fill="#d6dcff"/>
    <path d="M27 190 Q8 194 10 175 Q24 176 27 190 Z"
      fill="#ffffff"/>
    <path d="M236 171 Q257 163 251 145 Q238 154 236 171 Z"
      fill="#fff8e9"/>
    <path d="M236 180 Q258 179 254 160 Q240 164 236 180 Z"
      fill="#d6dcff"/>
    <path d="M233 190 Q252 194 250 175 Q236 176 233 190 Z"
