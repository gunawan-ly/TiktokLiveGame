<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300">
  <defs>
    <linearGradient id="card-gold-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4bd"/>
      <stop offset=".22" stop-color="#e8a83e"/>
      <stop offset=".42" stop-color="#fff0a0"/>
      <stop offset=".65" stop-color="#b96a21"/>
      <stop offset=".83" stop-color="#ffe9a0"/>
      <stop offset="1" stop-color="#8f4719"/>
    </linearGradient>
    <linearGradient id="card-gold-light" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffde0"/>
      <stop offset=".45" stop-color="#f6ca66"/>
      <stop offset="1" stop-color="#c27a29"/>
    </linearGradient>
    <linearGradient id="card-gold-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#485fe6"/>
      <stop offset=".48" stop-color="#2833a0"/>
      <stop offset="1" stop-color="#11164c"/>
    </linearGradient>
    <linearGradient id="card-gold-heart" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fff0fa"/>
      <stop offset=".28" stop-color="#ff8bc4"/>
      <stop offset=".62" stop-color="#e82f83"/>
      <stop offset="1" stop-color="#85174e"/>
    </linearGradient>
    <linearGradient id="card-gold-gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".28" stop-color="#9df6ff"/>
      <stop offset=".56" stop-color="#5288ff"/>
      <stop offset=".8" stop-color="#6442cf"/>
      <stop offset="1" stop-color="#f6b8ff"/>
    </linearGradient>
    <filter id="card-gold-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

